<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>新宿区の高低差</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Kaisei+Tokumin:wght@500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="map" aria-label="新宿区の高低差地図"></div>
    <aside class="plate" aria-label="凡例と操作">
      <p class="kicker">東京 新宿</p>
      <h1>新宿区の高低差</h1>
      <p class="lede">色が標高です。低いところほど青緑、高いところほど茶。</p>
      <p class="hint">
        区内をクリックすると、その地点の標高（メートル）を表示します。ドラッグで移動。拡大はホイールか＋−です。
      </p>
      <div class="legend">
        <p class="legend-title">標高（m）</p>
        <div id="legend-bar" class="legend-bar" role="img" aria-label="標高の色"></div>
        <div class="legend-ends">
          <span id="legend-min"></span>
          <span id="legend-max"></span>
        </div>
      </div>
      <p id="readout" class="readout" aria-live="polite"></p>
    </aside>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
  </body>
</html>
