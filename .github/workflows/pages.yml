name: Check static map

on:
  push:
    branches: [main]
  workflow_dispatch:

# This repo cannot enable GitHub Pages (Actions token cannot create the site).
# The clickable map is https://grok-bot-team.github.io/

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Required files exist
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s data/shinjuku.geojson
          grep -q "新宿区の高低差" index.html
          grep -q "dem5a_png" app.js
      - name: Public host still serves HTTPS
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/body.html -w "%{http_code}" --max-time 30 https://grok-bot-team.github.io/)
          test "$code" = "200"
          grep -q "新宿区の高低差" /tmp/body.html
